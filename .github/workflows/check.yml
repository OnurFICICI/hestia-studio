name: Validate theme
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          node --version
          php --version
          python3 --version
      - name: Theme and publication checks
        run: npm run check
      - name: Shell syntax
        run: |
          for script in scripts/install.sh scripts/restore.sh scripts/uninstall.sh tests/install-version.sh; do
            bash -n "$script"
          done
      - name: Installer version compatibility
        run: bash tests/install-version.sh
      - name: Build and verify release archives
        run: |
          npm run build
          python3 scripts/package.py
