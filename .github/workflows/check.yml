name: Validate theme
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          node --version
          php --version
          python3 --version
      - name: Theme and publication checks
        run: npm run check
      - name: Shell syntax
        run: |
          for script in scripts/install.sh scripts/restore.sh scripts/uninstall.sh; do
            bash -n "$script"
          done
      - name: Build and verify release archives
        run: |
          npm run build
          python3 scripts/package.py
