<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">Hestia Studio: seven light and dark accent palettes</title><desc id="desc">Exact accent colors from the theme stylesheet. The top row shows light mode and the bottom row shows dark mode.</desc>
<rect width="1120" height="330" rx="18" fill="#111820"/>
<text x="30" y="43" fill="#e6edf5" font-family="sans-serif" font-size="23" font-weight="700">Seven colors. Two appearances.</text>
<text x="30" y="69" fill="#a0afbf" font-family="sans-serif" font-size="13">Light and dark accent values from Hestia Studio 2.1.0</text>
<g font-family="sans-serif"><text x="30" y="102" fill="#e6edf5" font-size="14" font-weight="600">Green</text>
<rect x="30" y="114" width="136" height="86" rx="10" fill="#f6f8fa"/><rect x="42" y="127" width="112" height="29" rx="6" fill="#147D65"/><text x="42" y="182" fill="#172432" font-size="12">#147D65</text>
<rect x="30" y="212" width="136" height="86" rx="10" fill="#19232e"/><rect x="42" y="225" width="112" height="29" rx="6" fill="#64D9B2"/><text x="42" y="280" fill="#e6edf5" font-size="12">#64D9B2</text></g>
<g font-family="sans-serif"><text x="182" y="102" fill="#e6edf5" font-size="14" font-weight="600">Red</text>
