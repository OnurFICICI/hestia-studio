<rect x="638" y="114" width="136" height="86" rx="10" fill="#f6f8fa"/><rect x="650" y="127" width="112" height="29" rx="6" fill="#B34D16"/><text x="650" y="182" fill="#172432" font-size="12">#B34D16</text>
