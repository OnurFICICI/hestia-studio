<rect x="182" y="212" width="136" height="86" rx="10" fill="#19232e"/><rect x="194" y="225" width="112" height="29" rx="6" fill="#EF8A99"/><text x="194" y="280" fill="#e6edf5" font-size="12">#EF8A99</text></g>
<g font-family="sans-serif"><text x="334" y="102" fill="#e6edf5" font-size="14" font-weight="600">Blue</text>
<rect x="334" y="114" width="136" height="86" rx="10" fill="#f6f8fa"/><rect x="346" y="127" width="112" height="29" rx="6" fill="#2864BB"/><text x="346" y="182" fill="#172432" font-size="12">#2864BB</text>
<rect x="334" y="212" width="136" height="86" rx="10" fill="#19232e"/><rect x="346" y="225" width="112" height="29" rx="6" fill="#81B5FF"/><text x="346" y="280" fill="#e6edf5" font-size="12">#81B5FF</text></g>
<g font-family="sans-serif"><text x="486" y="102" fill="#e6edf5" font-size="14" font-weight="600">Yellow</text>
